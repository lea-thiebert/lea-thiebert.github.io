<body data-page="projects">
	<header class="site-header">

	<main class="container">
		<section class="projects-library">
			<h1 class="section-title reveal">Projets</h1>
			<p class="section-intro reveal">
				Recherche un projet par nom ou filtre les domaines pour n'afficher que ce qui t'interesse.
			</p>

			<div class="project-filters reveal" data-project-filters>
				<label class="project-search">
					<span>Recherche</span>
					<input type="search" data-project-search placeholder="Nom, mot-clé ou domaine">

					<legend>Domaines</legend>

					<label><input type="checkbox" name="project-filter" value="edi"> EDI</label>
				</fieldset>
			</div>

			<p class="projects-empty" data-project-empty hidden>Aucun projet ne correspond a cette recherche.</p>

					</a>
